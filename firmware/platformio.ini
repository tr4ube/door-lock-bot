[platformio]
default_envs = atoms3lite_diagnostic

[env]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

[env:atoms3lite_diagnostic]
build_src_filter = -<*> +<diagnostic_main.cpp>

[env:atoms3lite_runtime_check]
build_src_filter = -<*> +<runtime_main.cpp>
build_flags =
  ${env.build_flags}
  -D DOOR_LOCK_USE_EXAMPLE_SECRETS=1

[env:atoms3lite_runtime]
build_src_filter = -<*> +<runtime_main.cpp>
